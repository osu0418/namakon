    if (n === -2) t = '<b>まわりの地面</b>（掘らない所）　GL';
    else if (n >= 0) { const s = DATA.nokoru[n]; t = `<b>残る土</b>　${s.w}×${s.h}（横×縦 mm）<br>位置：${s.ichi}`; }
    else if (wx != null && inPit(wx, wy)) t = '<b>EVピット</b>（エレベーターの穴）　GL−1160<br>今は600ダウンとみなしている（ピットの深さは邸ごとにあとで調整）';
    else { const f = -z, down = f - K; t = `<b>掘る所</b>　GL−${f}` + (down <= 0 ? '' : down === 300 ? '（300ダウン）' : down === 600 ? '（600ダウン）' : '（ハンチの斜めの途中）'); }
    if (wx != null) { st.koko = { x: wx, y: wy, z: z }; t += '<br><button type="button" id="koko" style="margin-top:6px;font-weight:700">ここに立って見る</button>'; }
    fuda.innerHTML = t; fuda.style.display = 'block';
  }
  // 操作
  let down = null, raf = 0;
  const later = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(true); }); };
  // 2本指でつまむと大きく・小さく(ユーザー)。指の真ん中の所を動かさずに寄る。指の真ん中を動かすと図もずれる
  const yubi = new Map(); let pinch = null;
  const naka = () => { const a = [...yubi.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) }; };
  // 画面の点(ページの座標) → 地面(GL)の上の本当の位置(mm)。前に描いた絵の値で戻す
  const jimen = (cxp, cyp) => { const rc = cv.getBoundingClientRect(), k = last.Wc / rc.width, x = (cxp - rc.left) * k, y = (cyp - rc.top) * k;
    const xr = (x - last.ox) / last.S, yr = ((last.oy - y) / last.S) / last.sp; return [xr * last.ct + yr * last.s_t + MX, -xr * last.s_t + yr * last.ct + MY]; };
  cv.addEventListener('pointerdown', e => {
    yubi.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    if (yubi.size === 2 && last) { const m = naka(); pinch = { d0: Math.max(m.d, 1), z0: st.zoom, fov0: st.me ? st.me.fov : 0, W: st.me ? null : jimen(m.x, m.y) }; down = null; return; }
    if (yubi.size === 1) down = { x: e.clientX, y: e.clientY, th: st.th, ph: st.ph, pid: e.pointerId, yaw: st.me ? st.me.yaw : 0, pitch: st.me ? st.me.pitch : 0 };
  });
  cv.addEventListener('pointermove', e => {
    if (yubi.has(e.pointerId)) yubi.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && yubi.size >= 2 && last) {
      const m = naka(); if (st.me) { st.me.fov = Math.max(0.35, Math.min(1.9, pinch.fov0 * pinch.d0 / m.d)); later(); return; }
      const z = Math.max(1, Math.min(10, pinch.z0 * m.d / pinch.d0));
      if (z <= 1.001) { st.zoom = 1; st.cx = st.cy = null; later(); return; }
      // 指の真ん中に W が来るように、画面の真ん中に置く点を決める
      const rc = cv.getBoundingClientRect(), Sc = last.S / last.zoom * z * rc.width / last.Wc;   // 1mm が画面で何点か(ページの座標)
      const ct = last.ct, s_t = last.s_t, sp = last.sp, dx0 = pinch.W[0] - MX, dy0 = pinch.W[1] - MY;
      const q0 = dx0 * ct - dy0 * s_t - (m.x - rc.left - rc.width / 2) / Sc, q1 = (dx0 * s_t + dy0 * ct) * sp + (m.y - rc.top - rc.height / 2) / Sc;
      const yr = q1 / sp; st.cx = q0 * ct + yr * s_t + MX; st.cy = -q0 * s_t + yr * ct + MY; st.zoom = z; later(); return;
    }
    if (!down || e.pointerId !== down.pid) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) >= 6) down.moved = true; if (!down.moved) return; if (st.me) { st.me.yaw = down.yaw + (e.clientX - down.x) * 0.006; st.me.pitch = Math.max(-1.3, Math.min(0.6, down.pitch - (e.clientY - down.y) * 0.006)); later(); return; } st.th = down.th + (e.clientX - down.x) * 0.010; st.ph = Math.max(10 * Math.PI / 180, Math.min(89 * Math.PI / 180, down.ph + (e.clientY - down.y) * 0.008)); later(); });
  const up = e => {
    yubi.delete(e.pointerId);
    if (pinch) { if (yubi.size < 2) { pinch = null; down = null; draw(false); } return; }   // つまんだあとは押したことにしない
    if (!down || e.pointerId !== down.pid) return; const d0 = down; down = null;
    if (e.type === 'pointerup' && !d0.moved && last) {
      const rc = cv.getBoundingClientRect(), x = Math.round((e.clientX - rc.left) * last.Wc / rc.width), y = Math.round((e.clientY - rc.top) * last.Hc / rc.height);
      let bi = (x >= 0 && y >= 0 && x < last.Wc && y < last.Hc) ? last.bb[y * last.Wc + x] : -1; if (bi < -1) bi = -1;
      st.sel = bi === st.sel ? -1 : bi;
      // 押した点の本当の位置(mm)。押した箱の上の面の高さで戻す(確認役: 箱の真ん中で決めると、ピットから遠い所でもピットと出た)
      let wx = null, wy = null;
      if (st.sel >= 0 && last.me) { const z = DATA.boxes[st.sel][4] * st.ex, a = (x - last.Wc / 2) / last.F, bv = (last.Hc / 2 - y) / last.F, L2 = last;
        const dz = L2.f[2] + a * L2.r[2] + bv * L2.u[2]; if (Math.abs(dz) > 1e-6) { const t = (z - st.me.z) / dz; if (t > 0) { wx = st.me.x + t * (L2.f[0] + a * L2.r[0] + bv * L2.u[0]); wy = st.me.y + t * (L2.f[1] + a * L2.r[1] + bv * L2.u[1]); } } }
      else if (st.sel >= 0) { const z = DATA.boxes[st.sel][4] * st.ex, xr = (x - last.ox) / last.S, yr = ((last.oy - y) / last.S - z * last.cp) / last.sp; wx = xr * last.ct + yr * last.s_t + MX; wy = -xr * last.s_t + yr * last.ct + MY; }
      fudaDasu(st.sel, wx, wy);
      if (st.sel >= 0 && !st.me) { const b = DATA.boxes[st.sel]; if (st.zoom > 1) { st.cx = (b[0] + b[1]) / 2; st.cy = (b[2] + b[3]) / 2; }
        // 残る土を押したら、その土とまわりの通り芯が大きく入るまで寄る(寸法の数字が重ならないように)
        if (b[5] >= 0) { const s = DATA.nokoru[b[5]], XN = DATA.XN.map(g => g[1]), YN = DATA.YN.map(g => g[1]);
          const l = Math.max(...XN.filter(v => v <= s.x0).concat([s.x0])), r = Math.min(...XN.filter(v => v >= s.x1).concat([s.x1])), d = Math.max(...YN.filter(v => v <= s.y0).concat([s.y0])), u = Math.min(...YN.filter(v => v >= s.y1).concat([s.y1]));
          const span = Math.max(r - l, u - d, 1500), zen = Math.max(X1 - X0, Y1 - Y0) + 1800;
          st.cx = (l + r) / 2; st.cy = (d + u) / 2; st.zoom = Math.min(8, Math.max(st.zoom, zen / (span * 1.5))); } }
    }
    draw(false);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('touchmove', e => { if (down || pinch || e.touches.length > 1) e.preventDefault(); }, { passive: false });
  for (const ev of ['gesturestart', 'gesturechange']) cv.addEventListener(ev, e => e.preventDefault());   // iPhone の Safari の2本指の拡大を止める
  fuda.addEventListener('click', e => { if (!e.target || e.target.id !== 'koko' || !st.koko) return;
    const k = st.koko, yaw = Math.atan2(MX - k.x, MY - k.y);   // 初めは家の真ん中の方を向く
    st.me = { x: k.x, y: k.y, z: (k.z + 1500) * st.ex, yaw: Math.hypot(MX - k.x, MY - k.y) < 1000 ? 0 : yaw, pitch: -0.45, fov: 1.25 };   // 目の高さは押した所の面から1500(Claudeの仮定)
    st.sel = -1; fudaDasu(-1); document.getElementById('meModoru').hidden = false; draw(false); });
  document.querySelectorAll('[data-b]').forEach(bt => bt.addEventListener('click', () => {
    const k = bt.dataset.b;
    if (st.me) {   // 立って見ているとき: 回す＝見回す、正面に戻す・真上から＝全体の図に戻る
      if (k === 'left') { st.me.yaw -= Math.PI / 8; draw(false); return; } if (k === 'right') { st.me.yaw += Math.PI / 8; draw(false); return; }
      if (k === 'zin') { st.me.fov = Math.max(0.35, st.me.fov / 1.3); draw(false); return; } if (k === 'zout') { st.me.fov = Math.min(1.9, st.me.fov * 1.3); draw(false); return; }
      if (k === 'kyo') { const g = st.me.z / st.ex; st.ex = st.ex === 1 ? 2 : 1; st.me.z = g * st.ex; bt.classList.toggle('on', st.ex === 2); draw(false); return; }
      st.me = null; document.getElementById('meModoru').hidden = true;
    }
    if (k === 'left') st.th -= Math.PI / 8; else if (k === 'right') st.th += Math.PI / 8;
    else if (k === 'home') { st.th = TH0; st.ph = PHI0; st.zoom = 1; st.cx = st.cy = null; st.sel = -1; fudaDasu(-1); }
    else if (k === 'ue') { st.th = 0; st.ph = 89 * Math.PI / 180; }
    else if (k === 'zin') st.zoom = Math.min(6, st.zoom * 1.5);
    else if (k === 'zout') { st.zoom = Math.max(1, st.zoom / 1.5); if (st.zoom === 1) st.cx = st.cy = null; }
    else if (k === 'kyo') { st.ex = st.ex === 1 ? 2 : 1; bt.classList.toggle('on', st.ex === 2); }
    draw(false);
  }));
  window.addEventListener('resize', () => draw(false));
  draw(false);
  window.__rittai = { st, draw };   // 試し用
})();
