  // 面を作る: 各箱の上面と4つの横面(下は描かない)

  function faces() {
    const F = [];

      const [x0, x1, y0, y1, z, n] = b, zt = z * st.ex, zb = SOKO * st.ex;
      const top = n >= 0 ? CN : iroZ(z), side = n >= 0 ? CNS : mix(iroZ(z), [0, 0, 0], 0.18);
      F.push({ p: [[x0, y0, zt], [x1, y0, zt], [x1, y1, zt], [x0, y1, zt]], n: [0, 0, 1], col: top, key: 1e7 + Math.round(z) + (n >= 0 ? 5e6 : 0), box: bi });

  }
  // 見る向き: 平面を th 回し、ph の角度で見下ろす(正射影)
  function proj() {

    const cx = MX, cy = MY;

    const scr = q => [ox + q[0] * S, oy - q[1] * S, q[2]];

            const sc = shinUe(wx, wy, hw); if (sc) c = sc; }

      const o = y * Wc + x, k = kb[o];
      if (bb[o] < 0) { if ((bb[o + 1] >= 0) || (bb[o + Wc] >= 0)) { const t = bb[o + 1] >= 0 ? o + 1 : o + Wc; img[t * 4] = img[t * 4 + 1] = img[t * 4 + 2] = 60; } continue; }
      if ((bb[o + 1] >= 0 && kb[o + 1] !== k) || (bb[o + Wc] >= 0 && kb[o + Wc] !== k)) { img[o * 4] = img[o * 4 + 1] = img[o * 4 + 2] = 55; if (lw && x > 0) { const q = o - 1; img[q * 4] = Math.round(img[q * 4] * 0.6); img[q * 4 + 1] = Math.round(img[q * 4 + 1] * 0.6); img[q * 4 + 2] = Math.round(img[q * 4 + 2] * 0.6); } }
    }
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, Wc, Hc);
    const id = new ImageData(img, Wc, Hc);
    // 白い所(何も無い所)は背景の白
    for (let o = 0; o < N; o++) if (bb[o] < 0 && img[o * 4 + 3] === 0) { img[o * 4] = img[o * 4 + 1] = img[o * 4 + 2] = 255; img[o * 4 + 3] = 255; }
    ctx.putImageData(id, 0, 0);
    // 通り芯の記号(地面の高さ。家のまわり)
    const fs = Math.round(13 * dpr), r = 13 * dpr;
    ctx.font = 'bold ' + fs + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const maru = (x, y, t) => { const q = scr(P(x, y, 0)); ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2 * dpr / 1.4; ctx.strokeStyle = '#2050c0'; ctx.stroke(); ctx.fillStyle = '#2050c0'; ctx.fillText(t, q[0], q[1] + 0.5); };
    const M = 900;
    ctx.strokeStyle = 'rgb(222,0,0)'; ctx.lineWidth = 1.2 * dpr; ctx.setLineDash([10 * dpr, 4 * dpr, 2 * dpr, 4 * dpr]);
    const sen = (a, b) => { const p1 = scr(P(a[0], a[1], 0)), p2 = scr(P(b[0], b[1], 0)); ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke(); };
    for (const [, v] of DATA.XN) { sen([v, Y0 - M + r / S], [v, Y0]); sen([v, Y1 + M - r / S], [v, Y1]); }
    for (const [, v] of DATA.YN) { sen([X0 - M + r / S, v], [X0, v]); sen([X1 + M - r / S, v], [X1, v]); }
    ctx.setLineDash([]);
    for (const [n, v] of DATA.XN) { maru(v, Y0 - M, n); maru(v, Y1 + M, n); }
    for (const [n, v] of DATA.YN) { maru(X0 - M, v, n); maru(X1 + M, v, n); }
    // EVピットの札(今は600ダウンとみなす。ユーザー「600ダウンで今考えててもらって大丈夫」)
    for (const p of (DATA.pit || [])) { const q = scr(P((p[0] + p[1]) / 2, (p[2] + p[3]) / 2, -(K + 600) * st.ex)), tx = 'EVピット（600ダウン）';
      ctx.font = 'bold ' + Math.round(12 * dpr) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; const tw = ctx.measureText(tx).width + 10 * dpr, th = 20 * dpr;
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#555555'; ctx.lineWidth = 2 * dpr; ctx.fillRect(q[0] - tw / 2, q[1] - th / 2, tw, th); ctx.strokeRect(q[0] - tw / 2, q[1] - th / 2, tw, th); ctx.fillStyle = '#333333'; ctx.fillText(tx, q[0], q[1]); }
    ctx.font = 'bold ' + fs + 'px sans-serif';
    // 方角
    // 「Y5側」の矢印はやめた(四方に通り芯の丸があり、固定の字はほかの邸でずれるため。確認役)
    ctx.textAlign = 'left'; ctx.fillStyle = '#5b6662'; ctx.font = Math.round(11 * dpr) + 'px sans-serif';
    ctx.textBaseline = 'top'; ctx.fillText(st.ex === 2 ? '深さを2倍にして見せています' : '深さは本当の大きさ', 8 * dpr, 6 * dpr);
    last = { bb, Wc, Hc, dpr, ox, oy, S, ct, s_t, cp, sp };
  }
  // 札
  const inPit = (x, y) => (DATA.pit || []).some(p => x > p[0] && x < p[1] && y > p[2] && y < p[3]);
  function fudaDasu(bi, wx, wy) {
    if (bi < 0) { fuda.style.display = 'none'; return; }
    const b = DATA.boxes[bi], z = b[4], n = b[5];
    let t;
    if (n >= 0) { const s = DATA.nokoru[n]; t = `<b>残る土</b>　${s.w}×${s.h}（横×縦 mm）<br>位置：${s.ichi}`; }
    else if (wx != null && inPit(wx, wy)) t = '<b>EVピット</b>（エレベーターの穴）　GL−1160<br>今は600ダウンとみなしている（ピットの深さは邸ごとにあとで調整）';
    else { const f = -z, down = f - K; t = `<b>掘る所</b>　GL−${f}` + (down <= 0 ? '' : down === 300 ? '（300ダウン）' : down === 600 ? '（600ダウン）' : '（ハンチの斜めの途中）'); }
    fuda.innerHTML = t; fuda.style.display = 'block';
  }
  // 操作

  const later = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(true); }); };
  cv.addEventListener('pointerdown', e => { if (!e.isPrimary) return; down = { x: e.clientX, y: e.clientY, th: st.th, ph: st.ph, pid: e.pointerId }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
  cv.addEventListener('pointermove', e => { if (!down || e.pointerId !== down.pid) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) >= 6) down.moved = true; if (!down.moved) return; st.th = down.th + (e.clientX - down.x) * 0.010; st.ph = Math.max(10 * Math.PI / 180, Math.min(89 * Math.PI / 180, down.ph + (e.clientY - down.y) * 0.008)); later(); });

      // 押した点の本当の位置(mm)。押した箱の上の面の高さで戻す(確認役: 箱の真ん中で決めると、ピットから遠い所でもピットと出た)
      let wx = null, wy = null;
      if (st.sel >= 0) { const z = DATA.boxes[st.sel][4] * st.ex, xr = (x - last.ox) / last.S, yr = ((last.oy - y) / last.S - z * last.cp) / last.sp; wx = xr * last.ct + yr * last.s_t + MX; wy = -xr * last.s_t + yr * last.ct + MY; }

  }));
  window.addEventListener('resize', () => draw(false));
  draw(false);
  window.__rittai = { st, draw };   // 試し用
})();
